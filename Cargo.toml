[package]
name = "xmip-core-transport-ssdp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-ssdp"
description = "SSDP transport: UPnP discovery over UDP — alive and byebye notifications and search responses arrive as Streams, a Send Location announces or searches. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Standard library otherwise: SSDP is an HTTP-shaped
# text message in a datagram. Its declaration takes the capability's
# `timeout` (`transport::configured::timeout`).
transport = { workspace = true }
# A target read as a URI writes it (`net::Target`).
net = { workspace = true, optional = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
# The estate's encoding primitives: a header's bytes spelled in hex.
codec = { workspace = true, optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:net", "dep:codec"]
# The declaration alone.
declaration = []

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
